name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - run: npm run check:inputs
      - run: npm test
      - run: npm run test:boundaries
      - run: node scripts/verify-deepseek-records.mjs
      - run: node scripts/verify-progressive-showcase.mjs
      - name: Verify frozen saved-run scores
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath evidence/research/reproduction-records.zip -DestinationPath . -Force
          node scripts/verify-recorded-scores.mjs frozen-v1-20260925
      - name: Verify prospective DeepSeek records
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath evidence/validation-v2/reproduction-records.zip -DestinationPath . -Force
          Expand-Archive -LiteralPath evidence/validation-v3/reproduction-records.zip -DestinationPath . -Force
          node scripts/summarize-validation.mjs v2
          node scripts/summarize-validation.mjs v3
      - name: Verify current stronger controls and public table records
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath evidence/validation-v4/finqa/reproduction-records.zip -DestinationPath . -Force
          Expand-Archive -LiteralPath evidence/validation-v4/controls/reproduction-records.zip -DestinationPath . -Force
          node scripts/verify-v4.mjs
          node scripts/verify-financial-showcase.mjs
      - name: Verify preserved v5 and corrected v6 evidence
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath evidence/validation-v5/reproduction-records.zip -DestinationPath . -Force
          Expand-Archive -LiteralPath evidence/validation-v6/reproduction-records.zip -DestinationPath . -Force
          node scripts/verify-v5.mjs
          node scripts/verify-v6.mjs
          node scripts/verify-corrected-showcase.mjs

      - name: Verify all frozen dynamic-repair records
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath evidence/validation-v7/reproduction-records.zip -DestinationPath . -Force
          npm run verify:v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-v7.txt
      - run: npm run test:external-v7

      - name: Verify prospective model graphs and budgeted execution
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath evidence/validation-v8/reproduction-records.zip -DestinationPath . -Force
          npm run verify:v8
          node scripts/analyze-v8.mjs
