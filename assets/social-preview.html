<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stepwise Disclosure Demo — repository preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
    body { font-family: "Segoe UI", Arial, sans-serif; color: #f4f8f5; background: #143333; }
    main { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #143333; }
    main::before { content: ""; position: absolute; inset: 0 0 0 54%; background: #1a4442; transform: skewX(-17deg) translateX(120px); }
    .brand { position: absolute; top: 53px; left: 60px; display: flex; align-items: center; gap: 14px; }
    .brand img { width: 43px; height: 43px; }
    .brand span { font-size: 15px; font-weight: 700; letter-spacing: .18em; color: #b7d4cc; }
    .eyebrow { position: absolute; top: 164px; left: 60px; font-size: 16px; font-weight: 700; letter-spacing: .14em; color: #92d0b8; }
    h1 { position: absolute; left: 56px; top: 205px; margin: 0; font-size: 59px; line-height: 1.03; letter-spacing: -.045em; font-weight: 700; }
    .subtitle { position: absolute; left: 60px; top: 374px; width: 435px; margin: 0; color: #d5e8e1; font-size: 23px; line-height: 1.38; }
    .metrics { position: absolute; left: 60px; bottom: 62px; display: flex; gap: 34px; }
    .metric { min-width: 102px; border-top: 2px solid #669e8e; padding-top: 12px; }
    .metric strong { display: block; font-size: 27px; line-height: 1; font-weight: 650; }
    .metric span { display: block; margin-top: 8px; font-size: 13px; color: #aac9c0; }
    .screen { position: absolute; right: -17px; top: 75px; width: 690px; height: 482px; border: 8px solid #f3f7f4; border-radius: 17px; overflow: hidden; background: #fff; box-shadow: 0 29px 65px rgba(0,0,0,.27); }
    .screen img { display: block; width: 1035px; max-width: none; height: auto; transform: translate(-150px,-4px); }
    .caption { position: absolute; right: 39px; bottom: 43px; color: #c1dcd3; font-size: 14px; letter-spacing: .02em; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="../web/assets/hy-mark-dark.svg" alt=""><span>RESEARCH PROTOTYPE</span></div>
    <div class="eyebrow">AGENT EXECUTION · RECIPIENT VIEWS</div>
    <h1>Stepwise<br>Disclosure</h1>
    <p class="subtitle">Decide where each step runs.<br>Inspect exactly what each recipient receives.</p>
    <div class="metrics">
      <div class="metric"><strong>496</strong><span>current task runs</span></div>
      <div class="metric"><strong>592</strong><span>provider requests</span></div>
      <div class="metric"><strong>6</strong><span>saved live traces</span></div>
    </div>
    <div class="screen"><img src="../evidence/financial-showcase/ui/financial.en.png" alt="English research demo interface"></div>
    <div class="caption">Recorded DeepSeek run · English interface</div>
  </main>
</body>
</html>
