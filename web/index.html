<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent · 合同任务</title>
  <link rel="icon" href="/assets/hy-mark-dark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="symbol-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h5M8 13h8M8 17h8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8m-4-3v3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6 19a4 4 0 0 1-.3-8A7 7 0 0 1 19 9a5 5 0 0 1 0 10H6Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 18v3h16v-3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="task-sidebar" aria-label="任务导航">
      <div class="brand-lockup"><img src="/assets/hy-mark-dark.svg" alt="" width="32" height="32"><strong>Agent</strong></div>
      <button class="new-task" id="replay-side" type="button"><span>＋</span><span data-i18n="newRun">新建运行</span></button>
      <div class="sidebar-label" data-i18n="scenario">演示案例</div>
      <button class="sidebar-task is-active" type="button" id="task-nav"><svg><use href="#i-file"/></svg><span><strong data-i18n="caseTitle">采购合同风险提示</strong><small data-i18n="syntheticCase">合成合同 · 可复现</small></span></button>
      <label class="scenario-control"><span id="scenario-label">运行条件</span><select id="scenario-select" aria-label="运行条件"></select></label>
      <label class="scenario-control"><span id="mode-label">执行方式</span><select id="execution-mode" aria-label="执行方式"><option value="offline">本机规则执行器 · 无需密钥</option><option value="deepseek">DeepSeek · 自备密钥</option></select></label>
      <details class="input-adjust"><summary id="input-adjust-label">调整合成输入</summary><label><span id="amount-label">合同金额</span><input id="amount-override" type="number" min="0" max="1000000000" step="1" placeholder="保持 PDF 数值"></label><label><span id="days-label">迟延天数</span><input id="days-override" type="number" min="0" max="1000000000" step="1" placeholder="保持 PDF 数值"></label><small id="input-adjust-note">填写的值会覆盖本次运行输入；原始 PDF 保持不变。</small></details>
      <div class="sidebar-label" id="featured-label">真实模型记录</div><div id="featured-runs"></div>
      <div class="sidebar-label" id="history-label">近期运行</div><div id="run-history"></div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot"><span class="org-avatar">氢</span><span data-i18n="brand">氢川科技</span><span class="version">Demo</span></div>
    </aside>

    <main class="conversation-pane">
      <header class="conversation-header"><h1 data-i18n="taskTitle">检查采购合同并给出风险提示</h1><div class="header-actions"><span class="source-badge" id="source-badge" hidden></span><span class="header-state" id="header-state"></span></div></header>
      <div class="conversation-scroll" id="conversation-scroll">
        <section class="conversation-content" aria-label="Agent 任务">
          <div class="user-message"><span data-i18n="taskPrompt">检查这份采购合同，解释违约金条款并给出风险提示。</span><button id="attachment-link" class="attachment" type="button"><span class="pdf-icon">PDF</span><span><strong>采购合同（示例）.pdf</strong><small data-i18n="sampleDocument">合成样本 · 本地文件</small></span></button><time id="request-time"></time></div>
          <div class="agent-message"><span class="agent-avatar">A</span><div class="agent-body"><div class="agent-author"><strong>Agent</strong><time id="agent-time"></time></div><p id="agent-intro" data-i18n="agentIntro">我会先在本地读取合同并提取条款，再处理运行中发现的新步骤。</p><p id="execution-note" class="technical-note"></p><div class="step-list" id="step-list"></div><div class="agent-result" id="agent-result" hidden></div></div></div>
        </section>
      </div>
      <div class="composer-shell"><div class="composer"><button class="composer-icon" id="replay-button" type="button" title="重播已记录运行"><svg><use href="#i-refresh"/></svg></button><span class="composer-hint" data-i18n="composerHint">固定合成案例；运行会自动推进</span><select id="method-select" aria-label="实验方法"><option value="joint" data-i18n="joint">逐步联合判定</option><option value="full" data-i18n="full">完整上下文对照</option></select><button class="live-button" id="live-button" type="button"><svg><use href="#i-play"/></svg><span data-i18n="liveRun">现场运行</span></button></div></div>
    </main>

    <aside class="runtime-pane" aria-label="Agent 的电脑">
      <header class="runtime-header"><div class="runtime-name"><svg><use href="#i-monitor"/></svg><strong data-i18n="computer">Agent 的电脑</strong><span class="run-state" id="run-state"></span></div><div class="lang-switch" role="group" aria-label="Language"><button id="lang-zh" type="button" class="is-active">中文</button><button id="lang-en" type="button">EN</button></div></header>
      <nav class="runtime-tabs" aria-label="运行视图"><button class="is-active" data-tab="process" data-i18n="process">过程</button><button data-tab="terminal" data-i18n="terminal">终端</button><button data-tab="files" data-i18n="files">文件</button><button data-tab="preview" data-i18n="preview">预览</button></nav>
      <button id="follow-button" class="follow-button" type="button" hidden>跟随当前步骤</button>
      <div class="runtime-content" id="runtime-content"></div>
    </aside>
  </div>
  <script type="module" src="/research-app.js"></script>
</body>
</html>
